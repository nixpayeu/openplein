services:
  openplein:
    build: .
    restart: unless-stopped
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      MOLLIE_API_KEY: ${MOLLIE_API_KEY}
      PUBLIC_URL: https://plein.sovereignaigrid.nl
      SERVE_STATIC: "1"
      DEMO_SHOW_CODE: ${DEMO_SHOW_CODE:-0}
    ports:
      - "127.0.0.1:5175:5175"
    networks: [proxy]

networks:
  proxy:
    external: true
