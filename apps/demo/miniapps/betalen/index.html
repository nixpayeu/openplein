<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Betaal-demo</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 1.5rem 1.25rem;
    background: #0D1B2A; color: #C8D8E8; min-height: 100vh; box-sizing: border-box; }
  h1 { color: #F4F8FC; font-size: 1.5rem; margin: 0 0 .4rem; }
  p { line-height: 1.55; }
  button { background: #0D5C8F; color: #F4F8FC; border: 0; border-radius: 8px;
    padding: .65rem 1.3rem; font-size: 1rem; font-weight: 600; cursor: pointer;
    margin: .25rem .35rem .25rem 0; transition: background .15s ease; }
  button:hover { background: #1170ad; }
  button:disabled { opacity: .55; cursor: default; }
  #status { color: #06D6A0; font-weight: 600; margin-top: 1rem; }
</style></head>
<body>
  <h1>☕ Steun het Plein</h1>
  <p>Demo-betaling via Nixpay (Mollie-testmodus).</p>
  <button id="pay" data-amount="2.50">Doneer € 2,50</button>
  <button id="pay10" data-amount="10.00">Doneer € 10,00</button>
  <p id="status"></p>
  <script src="plein-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
